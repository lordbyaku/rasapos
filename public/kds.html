<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Kitchen Display — RasaPOS</title>
    <link rel="icon" href="/icons/favicon-32.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
</head>
<body class="!bg-neutral-950 !text-neutral-100 h-screen overflow-hidden flex flex-col select-none">
    <header class="h-14 bg-neutral-900 border-b border-neutral-800 flex items-center px-4 gap-3 shrink-0">
        <div class="w-9 h-9 rounded-xl bg-brand-500 text-white grid place-items-center font-extrabold">R</div>
        <div class="leading-tight hidden md:block"><div class="font-bold">Kitchen Display</div><div id="k-outlet" class="text-[11px] text-neutral-400"></div></div>
        <div id="k-stations" class="ml-2 flex bg-neutral-800 rounded-xl p-1 text-sm font-semibold overflow-x-auto no-scrollbar"></div>
        <div class="ml-auto flex items-center gap-3 text-sm">
            <span class="hidden lg:inline"><b id="k-new" class="text-sky-400">0</b> baru · <b id="k-prog" class="text-amber-400">0</b> diproses</span>
            <span id="k-avg" class="hidden xl:inline text-neutral-400"></span>
            <span id="k-net" class="badge"></span>
            <button id="k-recall" class="px-3 py-1.5 rounded-lg bg-neutral-800"><i class="fas fa-clock-rotate-left"></i><span class="hidden md:inline ml-1">Riwayat</span></button>
            <button id="k-sound" class="w-9 h-9 rounded-lg bg-neutral-800"><i class="fas fa-volume-high"></i></button>
            <button id="k-full" class="w-9 h-9 rounded-lg bg-neutral-800"><i class="fas fa-expand"></i></button>
            <button id="k-menu" class="w-9 h-9 rounded-lg bg-neutral-800"><i class="fas fa-gear"></i></button>
            <span id="k-clock" class="font-mono text-lg"></span>
        </div>
    </header>
    <main id="k-board" class="flex-1 overflow-x-auto thin-scroll p-4 flex gap-4 items-start"></main>

    <div id="k-start" class="fixed inset-0 z-50 bg-neutral-950/95 grid place-items-center cursor-pointer">
        <div class="text-center"><i class="fas fa-hand-pointer text-5xl text-brand-500"></i><p class="mt-4 text-xl font-bold">Ketuk untuk mulai</p><p class="text-neutral-400 text-sm mt-1">Mengaktifkan suara notifikasi & layar tetap menyala</p></div>
    </div>

    <div id="k-modal" class="hidden fixed inset-0 z-40 bg-black/70 items-center justify-center p-4">
        <div class="bg-neutral-900 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden border border-neutral-800">
            <div class="p-4 border-b border-neutral-800 flex items-center"><b id="k-modal-title" class="flex-1"></b><button data-close class="w-9 h-9 rounded-lg hover:bg-neutral-800"><i class="fas fa-xmark"></i></button></div>
            <div id="k-modal-body" class="flex-1 overflow-y-auto thin-scroll p-4"></div>
        </div>
    </div>
    <div id="print-area"></div>

    <script src="/vendor/sweetalert2.all.min.js"></script>
    <script src="/js/core/utils.js"></script>
    <script src="/js/core/api.js"></script>
    <script src="/js/core/realtime.js"></script>
    <script src="/js/core/pwa.js"></script>
    <script src="/js/core/escpos.js"></script>
    <script src="/js/core/receipt.js"></script>
    <script src="/js/core/printer.js"></script>
    <script src="/js/kds/app.js"></script>
</body>
</html>
